name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm before setup-node so the cache step can find it
      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Must run before tsc — generates astro:content and other virtual module types
      - name: Sync Astro types
        run: pnpm astro sync

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
