name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # package.json engines requires >=22.12.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generates .astro/types.d.ts — required before tsc can resolve astro:content
      - name: Sync Astro types
        run: npx astro sync

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
