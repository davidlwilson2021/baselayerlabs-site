<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <rect width="640" height="360" fill="#0a0a0a"/>

  <!-- Inset frame -->
  <rect x="12" y="12" width="616" height="336" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Dot grid -->
  <defs>
    <pattern id="dotsP" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="#3a3226"/>
    </pattern>
    <linearGradient id="fieldFadeP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a0a0a" stop-opacity="0.90"/>
      <stop offset="40%"  stop-color="#0a0a0a" stop-opacity="0.58"/>
      <stop offset="72%"  stop-color="#0a0a0a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="goldGlowP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="60%"  stop-color="#c9a962" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c9a962" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect x="22" y="22" width="596" height="316" fill="url(#dotsP)" opacity="0.65"/>
  <rect x="22" y="22" width="596" height="316" fill="url(#fieldFadeP)"/>
  <rect x="22" y="22" width="596" height="316" fill="url(#goldGlowP)"/>

  <!-- Horizontal register rules -->
  <line x1="14" y1="112" x2="626" y2="112" stroke="#5a4a1e" stroke-width="1"/>
  <line x1="14" y1="202" x2="626" y2="202" stroke="#5a4a1e" stroke-width="1"/>
  <line x1="14" y1="292" x2="626" y2="292" stroke="#5a4a1e" stroke-width="1"/>

  <!-- EOD threshold at 64% -->
  <line x1="402" y1="18" x2="402" y2="342" stroke="#3d3112" stroke-width="1"/>

  <!-- Report bars (right panel) -->
  <!-- Lane 1 -->
  <rect x="416" y="58"  width="148" height="2" fill="#584820"/>
  <rect x="416" y="66"  width="108" height="2" fill="#584820"/>
  <rect x="416" y="74"  width="68"  height="2" fill="#584820"/>
  <!-- Lane 2 -->
  <rect x="416" y="148" width="165" height="2" fill="#584820"/>
  <rect x="416" y="156" width="122" height="2" fill="#584820"/>
  <rect x="416" y="164" width="78"  height="2" fill="#584820"/>
  <!-- Lane 3 -->
  <rect x="416" y="237" width="140" height="2" fill="#584820"/>
  <rect x="416" y="245" width="102" height="2" fill="#584820"/>
  <rect x="416" y="253" width="64"  height="2" fill="#584820"/>
  <!-- Lane 4 -->
  <rect x="416" y="318" width="152" height="2" fill="#584820"/>
  <rect x="416" y="326" width="88"  height="2" fill="#584820"/>

  <!-- Right edge output columns -->
  <rect x="604" y="22" width="3" height="316" fill="#26200c"/>
  <rect x="614" y="22" width="3" height="316" fill="#584820"/>
  <rect x="624" y="22" width="3" height="316" fill="#967c42"/>

  <!-- Ghost letterforms -->
  <text x="18" y="134" font-family="Arial Black, Impact, sans-serif" font-size="118" font-weight="900"
        fill="white" fill-opacity="0.04">GHOST</text>
  <text x="18" y="250" font-family="Arial Black, Impact, sans-serif" font-size="118" font-weight="900"
        fill="#c9a962" fill-opacity="0.07">STACK</text>

  <!-- Catalog -->
  <text x="24" y="30" font-family="ui-monospace, Menlo, monospace" font-size="8"
        fill="#2a2008" letter-spacing="1">GS·001</text>

  <!-- Brand mark -->
  <text x="446" y="28" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700"
        fill="#967c42" letter-spacing="2">GHOSTSTACK</text>
  <text x="446" y="40" font-family="ui-monospace, Menlo, monospace" font-size="7"
        fill="#2a2008" letter-spacing="1">PHANTOM REGISTER · 2026</text>

  <!-- Bottom flow -->
  <text x="320" y="350" font-family="ui-monospace, Menlo, monospace" font-size="8"
        fill="#584820" letter-spacing="1" text-anchor="middle">RAW INPUT · AI SYNTHESIS · EOD REPORT</text>

  <!-- SPECTRAL ORDER -->
  <text x="24" y="350" font-family="ui-monospace, Menlo, monospace" font-size="7"
        fill="#2a2008" letter-spacing="1">SPECTRAL ORDER</text>
</svg>
